name: 每小时更新财经日报

on:
  schedule:
    - cron: "7 * * * *"      # 每小时第 7 分钟（避开整点拥堵）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复上一轮数据（用于去重与 10 天保留）
        uses: actions/cache@v4
        with:
          path: public/data.json
          key: finance-data-${{ github.run_id }}
          restore-keys: |
            finance-data-

      - name: 抓取并生成静态页
        run: python build_static.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
