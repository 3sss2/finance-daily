name: 实时更新财经日报

on:
  schedule:
    - cron: "*/5 * * * *"    # 每 5 分钟：只抓两个 7x24 快讯源（GitHub 允许的最短间隔）
    - cron: "7 * * * *"      # 每小时：全量（搜索、公众号、B 站、央行、统计局）
  workflow_dispatch:
    inputs:
      mode:
        description: "抓取范围：live=只抓快讯，full=全量"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - live

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    env:
      # 5 分钟那轮只跑快讯；整点那轮和手动触发跑全量
      FETCH_MODE: ${{ github.event.inputs.mode || ((github.event.schedule == '*/5 * * * *') && 'live' || 'full') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复上一轮数据（用于去重、保留期和变化比对）
        uses: actions/cache@v4
        with:
          path: public/data.json
          key: finance-data-${{ github.run_id }}
          restore-keys: |
            finance-data-

      - name: 抓取并生成静态页
        id: build
        run: python build_static.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
